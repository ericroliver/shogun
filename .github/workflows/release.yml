name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all binaries
        run: bun run pkg:all

      - name: Generate SHA256 checksums
        working-directory: bin
        run: |
          sha256sum shogun-macos-arm64 \
                    shogun-linux-x64 \
                    shogun-linux-arm64 \
                    shogun-win-x64.exe \
            > checksums.txt
          cat checksums.txt

      - name: Determine pre-release
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Mark as prerelease if tag contains common prerelease qualifiers
          # (e.g. -beta, -beta1, -beta.1, -rc1, -alpha2)
          if [[ "$TAG" =~ -(beta|rc|alpha|pre)([0-9]|\.|$|-) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: |
            bin/shogun-macos-arm64
            bin/shogun-linux-x64
            bin/shogun-linux-arm64
            bin/shogun-win-x64.exe
            bin/checksums.txt
